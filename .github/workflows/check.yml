# Runs the site check on every change pushed to GitHub, so a mistake shows up as a red X
# beside the commit (and on pull requests before they are merged).
name: Site check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.js
